
<div class="card shadow-sm" style="min-width: 360px;">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">Claims Staff Portal</h1>
    <p class="text-muted mb-4">Sign in to manage your claims workload.</p>

    @if (errorMessage()) {
      <div class="alert alert-danger py-2" role="alert">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" type="text" class="form-control" formControlName="username" autocomplete="username" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span>Signing in...</span>
        } @else {
          <span>Sign in</span>
        }
      </button>
    </form>
  </div>
</div>
